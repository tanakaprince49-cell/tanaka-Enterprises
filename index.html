    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Georgia', 'serif'],
            },
            animation: {
              'dot-in': 'dot-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
              'pulse-soft': 'pulse-soft 2s infinite',
            },
            keyframes: {
              'dot-in': {
                '0%': { transform: 'scale(0) translateY(4px)', opacity: '0' },
                '100%': { transform: 'scale(1) translateY(0)', opacity: '1' },
              },

              }
            }

        },
      }

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
            transition: background-color 0.5s ease, color 0.5s ease;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.2, 0, 0, 1);
        }
        
        html:not(.dark) .glass {
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .btn-premium {
            transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
            position: relative;
            overflow: hidden;
        }
        
        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.15);
        }
        
        .dark .btn-premium:hover {
            box-shadow: 0 12px 32px -8px rgba(255, 255, 255, 0.08);
        }
        
        .btn-premium:active {
            transform: translateY(1px) scale(0.98);
        }

        :focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px rgb(161 161 170 / 0.5);
        }
        
        .dark :focus-visible {
            box-shadow: 0 0 0 2px rgb(255 255 255 / 0.2);
        }

        ::selection {
            background: rgba(161, 161, 170, 0.2);
            color: inherit;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        html:not(.dark) ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        
        .nav-link-pill:hover {
            background: rgba(161, 161, 170, 0.1);
        }
    </style>
